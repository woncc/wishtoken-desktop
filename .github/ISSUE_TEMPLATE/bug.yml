name: Bug / 问题反馈
description: Report a reproducible issue without credentials or account files.
body:
  - type: markdown
    attributes:
      value: 请勿附账号 JSON、令牌、邮箱或完整数据目录。安全漏洞请使用私密报告入口。
  - type: input
    id: version
    attributes:
      label: 客户端版本 / Version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 操作系统与架构 / OS and architecture
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: 服务通道 / Channel
      options: [BPS, Native Codex, Not applicable]
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤与预期 / Steps and expected result
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: 实际结果 / Actual result
      description: Only sanitized error codes and request/response model or service-tier fields.
    validations:
      required: true
